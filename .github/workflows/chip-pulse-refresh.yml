name: Refresh Chip Pulse official updates

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chip-pulse-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CHIP_PULSE_SEC_USER_AGENT: ${{ secrets.CHIP_PULSE_SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Check SEC contact configuration
        run: test -n "$CHIP_PULSE_SEC_USER_AGENT"
      - run: npm ci
      - run: npm run chip-pulse:refresh
      - name: Commit official metadata and check status
        run: |
          if git diff --quiet -- src/data/chip-pulse-official-updates.json src/data/chip-pulse-refresh-status.json; then
            echo "No new official updates or check status."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/chip-pulse-official-updates.json src/data/chip-pulse-refresh-status.json
          git commit -m "data: refresh Chip Pulse official updates"
          git push
